steps:
  # ------------------------------------------------------------------
  # Step 1: Build Docker Image
  # ------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/app:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/app:latest'
      - '.'

  # ------------------------------------------------------------------
  # Step 2: Push ke Artifact Registry
  # ------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    waitFor: ['build-image']
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/app'

  # ------------------------------------------------------------------
  # Step 3: Deploy ke Cloud Run
  # Inject WEB3FORMS_ACCESS_KEY sebagai runtime secret
  # ------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloudrun'
    waitFor: ['push-image']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/app:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--min-instances'
      - '0'
      - '--cpu'
      - '1'
      - '--memory'
      - '1Gi'
      - '--allow-unauthenticated'
      - '--quiet'
      - '--set-secrets'
      - 'WEB3FORMS_ACCESS_KEY=WEB3FORMS_ACCESS_KEY:latest'

# ------------------------------------------------------------------
# Konfigurasi Build
# ------------------------------------------------------------------
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Timeout build (maksimal 20 menit)
timeout: '1200s'

# ------------------------------------------------------------------
# Substitutions — bisa di-override dari CLI atau Cloud Build Trigger
# ------------------------------------------------------------------
substitutions:
  _REGION: 'us-central1'
  _SERVICE: 'new-porto-service'
  _REPO: 'new-porto-repo'
