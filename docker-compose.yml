services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY}
    ports:
      - "3000:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    dns:
      - 8.8.8.8
    env_file:
      - .env
